<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arched photo comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #ece7dd; color: #28231d; font: 700 14px/1.4 Arial, sans-serif; }
      main { display: grid; grid-template-columns: 500px 390px; gap: 24px; justify-content: center; align-items: start; padding: 24px; }
      figure { margin: 0; padding: 12px; background: #fff; box-shadow: 0 10px 28px #281e1220; }
      figcaption { margin-bottom: 10px; }
      img { display: block; width: 100%; height: auto; }
      iframe { display: block; width: 390px; height: 844px; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Reference</figcaption>
        <img src="./reference-arched-photo.jpg" alt="Reference invitation design">
      </figure>
      <figure>
        <figcaption>Mobile implementation</figcaption>
        <iframe id="implementation" src="../index.html#wedding-card" title="Mobile implementation"></iframe>
      </figure>
    </main>
    <script>
      const frame = document.querySelector("#implementation");
      frame.addEventListener("load", () => {
        window.setTimeout(() => {
          frame.contentDocument.querySelector(".couple")?.scrollIntoView({ block: "center" });
        }, 700);
      });
    </script>
  </body>
</html>
